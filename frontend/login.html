<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              skydeep: "#0f172a",
              sea: "#0ea5e9",
              sand: "#f59e0b",
            },
            fontFamily: {
              display: ["Poppins", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .auth-bg-image {
        background-image: url("https://images5.alphacoders.com/336/thumb-1920-336625.jpg");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }
    </style>
  </head>
  <body
    data-page="auth"
    class="min-h-screen font-display text-white"
  >
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10">
      <div class="auth-bg-image absolute inset-0"></div>
      <div class="absolute inset-0 bg-slate-950/60"></div>
      <div class="absolute inset-0 bg-gradient-to-br from-slate-950/55 via-slate-900/35 to-slate-950/65"></div>
    </div>

    <main class="mx-auto flex min-h-screen max-w-5xl items-center px-4 py-8">
      <section
        class="grid w-full grid-cols-1 gap-6 rounded-2xl bg-white/10 p-6 backdrop-blur md:grid-cols-2 md:p-8"
      >
        <div class="space-y-4">
          <p class="text-sm uppercase tracking-[0.2em] text-sky-200">
            Weather App with Favorites
          </p>
          <h1 class="text-3xl font-bold leading-tight md:text-4xl">
            Track weather and save your favorite cities.
          </h1>
          <p class="text-slate-100/90">
            Register an account, search live weather, and keep a personalized
            favorites list.
          </p>
        </div>

        <div class="space-y-4">
          <div class="flex gap-2">
            <button
              id="showLogin"
              class="w-1/2 rounded-lg bg-sea px-4 py-2 font-semibold"
            >
              Login
            </button>
            <button
              id="showRegister"
              class="w-1/2 rounded-lg bg-white/20 px-4 py-2 font-semibold"
            >
              Register
            </button>
          </div>

          <form id="authForm" class="space-y-3 rounded-xl bg-slate-950/40 p-5">
            <h2 id="formTitle" class="text-xl font-semibold">Login</h2>
            <input
              id="email"
              type="email"
              placeholder="Email"
              class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-2 outline-none ring-sea focus:ring"
              required
            />
            <input
              id="password"
              type="password"
              placeholder="Password (min 6 chars)"
              class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-2 outline-none ring-sea focus:ring"
              required
            />
            <button
              type="submit"
              id="submitBtn"
              class="w-full rounded-lg bg-sand px-4 py-2 font-semibold text-slate-900"
            >
              Login
            </button>
            <p id="authMessage" class="min-h-6 text-sm"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
