<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cloud: "#f1f5f9",
              ocean: "#0369a1",
              ember: "#f97316",
            },
            fontFamily: {
              display: ["Manrope", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    data-page="favorites"
    class="min-h-screen bg-[radial-gradient(circle_at_top,_#bae6fd,_#e2e8f0_45%,_#cbd5e1)] font-display text-slate-900"
  >
    <main class="mx-auto max-w-6xl px-4 py-8">
      <header
        class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white/80 p-4 shadow-sm"
      >
        <h1 class="text-2xl font-extrabold">Your Favorites</h1>
        <nav class="flex gap-2">
          <a
            href="/weather"
            class="rounded-lg bg-ocean px-4 py-2 text-sm font-semibold text-white"
            >Back to Search</a
          >
          <button
            id="logoutBtn"
            class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold text-white"
          >
            Logout
          </button>
        </nav>
      </header>

      <section class="rounded-2xl bg-white/90 p-4 shadow">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-bold">Saved Locations</h2>
            <p class="text-sm text-slate-500">
              Revisit the places you’ve bookmarked and jump back into their
              latest conditions.
            </p>
          </div>
          <span
            class="rounded-full bg-cloud px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-600"
          >
            Favorites
          </span>
        </div>
        <p id="favoritesMessage" class="mb-3 min-h-5 text-sm"></p>
        <div
          id="favoritesGrid"
          class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3"
        ></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
