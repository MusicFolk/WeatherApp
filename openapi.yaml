openapi: 3.0.3
info:
  title: Weather App with Favorites API
  version: 1.0.0
  description: |
    API for user authentication, weather lookup via WeatherAPI, and managing user favorites.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
  - name: Weather
  - name: Favorites

paths:
  /api/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: user@example.com
              password: secret123
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid input (e.g., "Email and password are required", "Invalid email format", or "Password must be at least 6 characters")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Email and password are required"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Email already registered"
        "500":
          description: Server error (e.g., "Failed to register user" or "Server error while registering")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to register user"

  /api/login:
    post:
      tags:
        - Auth
      summary: Log in a user and receive an httpOnly session cookie
      description: |
        Authenticates user credentials and sets an httpOnly cookie containing a JWT token.
        The cookie is automatically sent with subsequent requests and cannot be accessed by JavaScript.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: secret123
      responses:
        "200":
          description: Login successful. An httpOnly cookie is automatically set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
                example: authToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; SameSite=lax; Max-Age=86400; Path=/
              description: httpOnly session cookie valid for 24 hours
        "400":
          description: Invalid input ("Email and password are required")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Email and password are required"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid credentials"
        "500":
          description: Server error (e.g., "Failed to login" or "Server error while logging in")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to login"

  /api/logout:
    post:
      tags:
        - Auth
      summary: Log out and clear the session cookie
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout successful. Session cookie has been cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: authToken=; HttpOnly; SameSite=lax; Max-Age=0; Path=/
              description: Clears the httpOnly session cookie
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth-status:
    get:
      tags:
        - Auth
      summary: Check whether the current session is authenticated
      description: |
        Returns authentication status based on the authToken cookie.
        This endpoint does not require authentication and always returns 200 with a boolean status.
      responses:
        "200":
          description: Authentication status returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
              examples:
                authenticated:
                  summary: Authenticated session
                  value:
                    authenticated: true
                unauthenticated:
                  summary: No valid session
                  value:
                    authenticated: false

  /api/weather:
    get:
      tags:
        - Weather
      summary: Get current weather for a city (authentication required)
      description: Fetches weather data from WeatherAPI. Requires valid session cookie.
      security:
        - cookieAuth: []
      parameters:
        - name: city
          in: query
          required: true
          description: City name to look up
          schema:
            type: string
          example: Vilnius
        - name: country
          in: query
          required: false
          description: Optional country name to narrow the search
          schema:
            type: string
          example: Lithuania
      responses:
        "200":
          description: Weather data returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        "400":
          description: Missing city parameter ("Query parameter 'city' is required")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Query parameter 'city' is required"
        "401":
          description: Authentication required or session expired ("Authentication required" or "Invalid or expired token")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: City not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "No matching location found"
        "502":
          description: Weather API failure ("Failed to fetch weather data" or external API error message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to fetch weather data"
        "500":
          description: Server misconfiguration or internal error ("Weather API key is not configured")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Weather API key is not configured"

  /api/weather/forecast:
    get:
      tags:
        - Weather
      summary: Get weather forecast for a city (authentication required)
      description: Fetches multi-day weather forecast data from WeatherAPI. Requires valid session cookie.
      security:
        - cookieAuth: []
      parameters:
        - name: city
          in: query
          required: true
          description: City name to look up
          schema:
            type: string
          example: Vilnius
        - name: country
          in: query
          required: false
          description: Optional country name to narrow the search
          schema:
            type: string
          example: Lithuania
        - name: days
          in: query
          required: false
          description: Number of forecast days (1-10). Defaults to 5.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
          example: 5
      responses:
        "200":
          description: Forecast data returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "400":
          description: Invalid query parameter (e.g., "Query parameter 'city' is required" or "Query parameter 'days' must be an integer between 1 and 10")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Query parameter 'days' must be an integer between 1 and 10"
        "401":
          description: Authentication required or session expired ("Authentication required" or "Invalid or expired token")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Authentication required"
        "404":
          description: City not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "No matching location found"
        "502":
          description: Weather API failure ("Failed to fetch weather data" or external API error message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to fetch weather data"
        "500":
          description: Server misconfiguration or internal error ("Weather API key is not configured")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Weather API key is not configured"

  /api/favorites:
    get:
      tags:
        - Favorites
      summary: List the authenticated user's favorites
      description: Returns all favorite cities for the authenticated user via session cookie.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Favorites returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
        "401":
          description: Authentication required or session expired ("Authentication required" or "Invalid or expired token")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Authentication required"
        "500":
          description: Server error ("Failed to load favorites")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to load favorites"

    post:
      tags:
        - Favorites
      summary: Add a city to favorites
      description: Adds a city to the authenticated user's favorites via session cookie.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteCreateRequest"
            example:
              city: Vilnius
      responses:
        "201":
          description: Favorite saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"
        "400":
          description: Invalid input ("City is required and must be at least 2 characters")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "City is required and must be at least 2 characters"
        "401":
          description: Authentication required or session expired ("Authentication required" or "Invalid or expired token")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Authentication required"
        "409":
          description: City already in favorites ("City is already in favorites")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "City is already in favorites"
        "500":
          description: Server error ("Failed to save favorite")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to save favorite"

  /api/favorites/{id}:
    delete:
      tags:
        - Favorites
      summary: Delete one favorite by id
      description: Deletes a favorite city for the authenticated user via session cookie.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Favorite id
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: Favorite deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Favorite deleted
        "400":
          description: Invalid favorite id ("Invalid favorite id")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid favorite id"
        "401":
          description: Authentication required or session expired ("Authentication required" or "Invalid or expired token")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Authentication required"
        "404":
          description: Favorite not found ("Favorite not found")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Favorite not found"
        "500":
          description: Server error ("Failed to delete favorite")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Failed to delete favorite"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: authToken
      description: httpOnly session cookie containing a signed JWT token

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
              format: email

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
          description: Session cookie (authToken) has been set automatically

    AuthStatusResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
          example: true

    WeatherResponse:
      type: object
      properties:
        location:
          type: object
          properties:
            name:
              type: string
            region:
              type: string
            country:
              type: string
            localtime:
              type: string
        weather:
          type: object
          properties:
            temperatureC:
              type: number
            temperatureF:
              type: number
            condition:
              type: string
            icon:
              type: string
            humidity:
              type: integer
            windKph:
              type: number

    ForecastDay:
      type: object
      properties:
        date:
          type: string
          example: "2026-04-22"
        maxTempC:
          type: number
          example: 17.4
        minTempC:
          type: number
          example: 7.2
        condition:
          type: string
          example: Partly cloudy
        icon:
          type: string
          example: //cdn.weatherapi.com/weather/64x64/day/116.png
        chanceOfRain:
          type: integer
          example: 35

    ForecastResponse:
      type: object
      properties:
        city:
          type: string
          example: Vilnius
        days:
          type: array
          items:
            $ref: "#/components/schemas/ForecastDay"

    FavoriteCreateRequest:
      type: object
      required:
        - city
      properties:
        city:
          type: string
          minLength: 2

    Favorite:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        city:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
